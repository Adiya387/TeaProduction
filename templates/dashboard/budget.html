{% extends 'base.html' %}

{% block content %}
<main class="dashboard-main fade-in">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
        <h1 style="font-weight: 800; color: #1e293b;">Управление бюджетом</h1>
        <div style="display: flex; gap: 12px;">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="tableSearch" placeholder="Поиск..." onkeyup="filterTable()">
            </div>
            {% if items|length == 0 %}
            <button class="btn-primary" style="width: auto; padding: 12px 24px;" onclick="openAddModal()">
                <i class="fas fa-plus"></i> Инициализировать бюджет
            </button>
            {% endif %}
        </div>
    </div>

    <!-- Data Table -->
    <div class="chart-card" style="padding: 0; overflow: hidden;">
        <table id="dataTable" style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">
            <thead style="background: #f8fafc;">
                <tr>
                    <th style="padding: 16px 24px;">ID</th>
                    <th style="padding: 16px 24px;">Текущий баланс</th>
                    <th style="padding: 16px 24px; text-align: right;">Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr style="border-bottom: 1px solid var(--border-light);">
                    <td style="padding: 16px 24px; color: var(--text-muted);">#{{ item.id }}</td>
                    <td style="padding: 16px 24px; font-weight: 800; color: var(--primary); font-size: 16px;">
                        {{ item.total }} сом
                    </td>
                    <td style="padding: 16px 24px; text-align: right;">
                        <button class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 13px;" 
                                onclick="openEditModal('{{ item.id }}', '{{ item.total }}')">
                            <i class="fas fa-edit"></i> Изменить баланс
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="crudModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Управление бюджетом</h2>
            <button class="btn-close" onclick="closeModal('crudModal')"><i class="fas fa-times"></i></button>
        </div>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="id" id="item_id">
            <div class="modal-body">
                <div class="form-group">
                    <label>Общая сумма бюджета (сом)</label>
                    <input type="number" name="total" id="item_total" class="form-control" step="0.01" required placeholder="0.00">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-close" style="width: auto; height: auto; border-radius: 8px; padding: 10px 20px;" onclick="closeModal('crudModal')">Отмена</button>
                <button type="submit" class="btn-primary">Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = "Инициализация бюджета";
        document.getElementById('item_id').value = "";
        document.getElementById('item_total').value = "";
        openModal('crudModal');
    }

    function openEditModal(id, total) {
        document.getElementById('modalTitle').textContent = "Корректировка бюджета";
        document.getElementById('item_id').value = id;
        document.getElementById('item_total').value = total;
        openModal('crudModal');
    }

    function filterTable() {
        const input = document.getElementById("tableSearch");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("dataTable");
        const tr = table.getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            let found = false;
            const tds = tr[i].getElementsByTagName("td");
            for (let j = 0; j < tds.length; j++) {
                if (tds[j].textContent.toUpperCase().indexOf(filter) > -1) {
                    found = true; break;
                }
            }
            tr[i].style.display = found ? "" : "none";
        }
    }

    // Format table values on load
    document.addEventListener('DOMContentLoaded', () => {
        const table = document.getElementById('dataTable');
        const rows = table.getElementsByTagName('tr');
        for (let i = 1; i < rows.length; i++) {
            const cell = rows[i].cells[1];
            const val = cell.textContent.trim().replace(' сом', '');
            cell.textContent = formatBusinessVal(val, true);
        }
    });
</script>
{% endblock %}
