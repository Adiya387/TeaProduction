{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea ERP - Авторизация</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.4);
            --primary-gradient: linear-gradient(135deg, #15803d 0%, #166534 100%);
            --accent: #22c55e;
        }

        body.login-bg {
            background: radial-gradient(circle at top right, #dcfce7 0%, #f0fdf4 50%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Background Elements */
        .bg-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        .sphere-1 { width: 400px; height: 400px; background: rgba(34, 197, 94, 0.1); top: -100px; right: -100px; }
        .sphere-2 { width: 300px; height: 300px; background: rgba(21, 128, 61, 0.08); bottom: -50px; left: -50px; animation-delay: -5s; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 56px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 40px 80px -20px rgba(21, 128, 61, 0.12);
            position: relative;
            z-index: 10;
            animation: card-in 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-box h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .logo-box p {
            color: #64748b;
            font-size: 15px;
            font-weight: 400;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .form-control {
            background: #f8fafc !important;
            border: 2px solid #e2e8f0 !important;
            border-radius: 16px !important;
            padding: 14px 20px !important;
            font-size: 15px !important;
            color: #1e293b !important;
            transition: all 0.2s ease !important;
            width: 100%;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1) !important;
            background: #fff !important;
        }

        .btn-login {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(21, 128, 61, 0.3);
            margin-top: 20px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -5px rgba(21, 128, 61, 0.4);
            filter: brightness(1.1);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Modal Redesign */
        .modal-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }

        .modal-box {
            background: #fff;
            border-radius: 32px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .modal-text {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            background: #f0fdf4;
            color: var(--accent);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 24px;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .btn-confirm {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; }
        .toast { 
            background: #fff; 
            color: #1e293b; 
            padding: 16px 24px; 
            border-radius: 20px; 
            font-size: 14px; 
            font-weight: 600; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-left: 6px solid #ef4444;
            animation: toast-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="login-bg">
    <div class="bg-sphere sphere-1"></div>
    <div class="bg-sphere sphere-2"></div>
    <div class="login-card">
        <div class="logo-box">
            <h1>Tea ERP</h1>
            <p>Система управления производством</p>
        </div>

        {% if error %}
        <div style="background: #fef2f2; color: #dc2626; padding: 14px; border-radius: 16px; margin-bottom: 24px; font-size: 14px; text-align: center; border: 1px solid #fee2e2; font-weight: 600;">
            <i class="fas fa-circle-exclamation" style="margin-right: 8px;"></i> {{ error }}
        </div>
        {% endif %}

        <form id="loginForm" method="POST">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Имя пользователя</label>
                <input type="text" name="username" class="form-control" required placeholder="admin">
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Пароль</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="form-group" style="margin-bottom: 32px;">
                <label>Выберите роль доступа</label>
                <select name="selected_role" id="roleSelect" class="form-control" required style="cursor: pointer;">
                    <option value="" disabled selected>-- Нажмите для выбора --</option>
                    <option value="Admin">Админ (Полный доступ)</option>
                    <option value="Manager">Менеджер (Закупки и продажи)</option>
                    <option value="Accountant">Бухгалтер (Финансы и кредиты)</option>
                    <option value="Supervisor">Супервайзер (Системный контроль)</option>
                </select>
            </div>
            <button type="submit" class="btn-login">
                Войти в систему <i class="fas fa-arrow-right" style="margin-left: 8px; font-size: 14px;"></i>
            </button>
        </form>
    </div>

    <!-- Confirmation Modal Redesigned -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h2 class="modal-title">Подтверждение роли</h2>
            <p id="modalText" class="modal-text">
                Вы выбрали роль: <strong>Супервайзер</strong>. <br>Продолжить вход в систему?
            </p>
            <div class="modal-actions">
                <button type="button" class="btn-confirm" id="btnConfirm">Да, подтверждаю</button>
                <button type="button" class="btn-cancel" id="btnCancel">Сменить роль</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const roleSelect = document.getElementById('roleSelect');
        const confirmModal = document.getElementById('confirmModal');
        const modalText = document.getElementById('modalText');
        const btnConfirm = document.getElementById('btnConfirm');
        const btnCancel = document.getElementById('btnCancel');
        const loginForm = document.getElementById('loginForm');

        roleSelect.addEventListener('change', function() {
            if (this.value) {
                const roleName = this.options[this.selectedIndex].text.split(' (')[0];
                modalText.innerHTML = `Вы выбрали роль: <strong>${roleName}</strong>. <br>Продолжить вход с этой ролью?`;
                confirmModal.classList.add('active');
            }
        });

        btnConfirm.addEventListener('click', () => {
            confirmModal.classList.remove('active');
        });

        btnCancel.addEventListener('click', () => {
            roleSelect.value = "";
            confirmModal.classList.remove('active');
        });

        loginForm.addEventListener('submit', function(e) {
            if (!roleSelect.value) {
                e.preventDefault();
                showToast("Пожалуйста, выберите роль!");
            }
        });

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#ef4444"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
